name: ci
on:
  push: { branches: [gh-pages] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci || npm install
      - run: npm test
      # The soak is the money test: parallel trades, then conservation.
      - run: node tools/soak.js
